server:
  port: 8080

spring:
  application:
    name: pqc-assinatura-digital
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}      # variável de ambiente — não commitar senha
    password: ${MAIL_PASSWORD}      # use App Password do Google, não a senha normal
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000

  # Banco H2 em memória para desenvolvimento/testes
  datasource:
    url: jdbc:h2:mem:pqcdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop  # Cria as tabelas ao iniciar, apaga ao parar
    show-sql: true           # Mostra o SQL gerado no console (útil no TCC)
    properties:
      hibernate:
        format_sql: true

  # Limite de tamanho para upload de PDF/Word
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
