server:
  port: 8080

spring:
  application:
    name: pqc-assinatura-digital

  # Banco H2 em memória para testes
  datasource:
    url: jdbc:h2:mem:pqcdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
